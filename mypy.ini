[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = False
# Third-party SDK typing (openai/anthropic AsyncStream unions, tool call unions)
# causes noise that does not reflect runtime defects. We still run mypy for
# first-party modules; strict fixing of vendor stubs is out of RC3 scope.

[mypy-app.llm.openai]
ignore_errors = True

[mypy-app.llm.anthropic]
ignore_errors = True

[mypy-app.llm.grok]
ignore_errors = True
